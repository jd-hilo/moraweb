services:
  - type: web
    name: mora-web
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run dev:all
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_CLAUDE_API_KEY
        sync: false
      - key: VITE_MIXPANEL_TOKEN
        sync: false
      - key: VITE_PROXY_URL
        sync: false


